[recipe-description]
rabbasca-locate-stabilizer=Instruct the vault to locate a [space-location=rabbasca-underground] and place [entity=rabbasca-warp-pylon] nearby. This may take multiple attempts, but failed attempts refund the pylon.\nIf a stabilizer is currently located, on success an additional [entity=rabbasca-warp-pylon] will be placed next to it.\n[color=#33aaff][img=virtual-signal.signal-info]This recipe deselects itself on success.[/color]
rabbasca-anomaly-extractor=Restarts [entity=rabbasca-anomaly-extractor], which will constantly harvest [item=rabbasca-warp-anomaly] to fuel [entity=rabbasca-warp-stabilizer]. It will run continuously, even when the stabilizer is paused. 
rabbasca-amplify-anomaly=Destabilizes the position of the crafter, increasing the chance to manifest a resource patch below it (see [tip=rabbasca-manifest-anomaly]). This can cause resources to spawn on [tile=rabbasca-underground-rubble-powered] to establish permanent mining sites.
rabbasca-abandon-stabilizer=Give up on this stabilizer. This might be your last option if the stabilizer ran out of fuel. [entity=rabbasca-vault-crafter] can discover a new stabilizer afterwards.\n[color=red][img=virtual-signal.signal-alert] Everything around the stabilizer will be destroyed, including your factory![/color]\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer] can craft recipes even when out of fuel[/color]
rabbasca-warp-cell=[color=#33aaff][img=virtual-signal.signal-info]This recipe does not consume fuel when crafted by [entity=rabbasca-warp-stabilizer].[/color]\n[color=#33aaff][img=virtual-signal.signal-info]When 'Synthesize fuel' is enabled in [entity=rabbasca-warp-stabilizer]'s control panel, it will automatically switch to this recipe when out of fuel.[/color]
rabbasca-stabilizer-warp-sequence=Warps to the next location, [color=yellow]leaving behind anything not placed on [tile=rabbasca-underground-rubble-powered][/color]. Remaining anomalies have a chance to manifest into resources. [item=rabbasca-warp-trace] stasis will be suspended during warp.\n[color=#33aaff][img=virtual-signal.signal-info]This recipe will not craft when [entity=rabbasca-warp-stabilizer] is not fully covered by [tile=rabbasca-underground-rubble-powered][/color]\n[color=#33aaff][img=virtual-signal.signal-info]When 'Autopilot' is enabled in [entity=rabbasca-warp-stabilizer]'s control panel, it will automatically switch to this recipe once stabilization reaches 100%[/color]
rabbasca-floor-stability-work=Prevents health loss
rabbasca-warp-cell-recharging=[color=#33aaff][img=virtual-signal.signal-info]Crafting this will place the result directly in [entity=rabbasca-warp-stabilizer]'s cell storage[/color]
rabbasca-stabilizer-recharge=While this recipe is crafting, all [item=rabbasca-warp-cell-recharging] and [item=rabbasca-warp-cell] are warped into the stabilizer's fuel inventory.\n\n[color=#33aaff][img=virtual-signal.signal-info]Any cells not affected by this recipe need to be re-registered by opening them with __CONTROL__open-item__[/color]
rabbasca-underground=Locate [entity=rabbasca-warp-stabilizer] and uncover the secrets of rabbascan warp technology.
rabbasca-hunt-relicaries=Increase the chances of finding [entity=rabbasca-relicary] on future warps by 0.4%. Chance persists between warps and resets once one was found. Check [entity=rabbasca-warp-stabilizer] or readings in [entity=constant-combinator] to see the current chance.
rabbasca-hunt-anomalies=Increase the resource yield of [entity=rabbasca-warp-anomaly] by 3% on the next warp. After warp, yield resets to 100%. Check [entity=rabbasca-warp-stabilizer] or readings in [entity=constant-combinator] to see the yield for next warp.
rabbasca-plastic-from-petroleum-gas=Extreme conditions allow plastic creation without [item=coal].
rabbasca-warpfield-science-pack-wi-download=Extracts up to 100 [item=rabbasca-warpfield-science-pack] from this vault. The supply is limited to the amount previously uploaded via [recipe=rabbasca-warpfield-science-pack-wi-upload].
rabbasca-warpfield-science-pack-wi-upload=Inputs will be uploaded to the [entity=rabbasca-vault-crafter] network, and accessible via [recipe=rabbasca-warpfield-science-pack-wi-download].
rabbasca-relocate-floorthing=[entity=rabbasca-stability-pylon] can not be deconstructed, but on crafting this recipe, it will try to relocate itself to a [virtual-signal=signal-ghost][entity=rabbasca-stability-pylon].
rabbasca-summon-ufo=Call your [entity=rabbasca-ufo] fleet for assistance. All [entity=rabbasca-ufo] will try to warp nearby from anywhere. Warping requires an empty inventory and consumes 50% fuel.
rabbasca-embrace-insanity=Isn't this kind of comforting...?
rabbasca-powershard=Temporarily weaken [item=rabbasca-powerspike] to get additional fuel for [entity=rabbasca-relicary].

