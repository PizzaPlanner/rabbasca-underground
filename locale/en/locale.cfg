[entity-description]
rabbasca-warp-stabilizer=A true marvel of rabbascan engineering that actively seeks and purges [entity=rabbasca-warp-anomaly], converting them to fuel for [item=rabbasca-warp-cell]. \n
rabbasca-anomaly-extractor=The engine required to power [entity=rabbasca-warp-stabilizer]. Fuels itself by constantly purging [entity=rabbasca-warp-anomaly].\n\n[img=virtual-signal.signal-alert] Can not be stopped once started by [technology=rabbasca-warp-stabilizer].\nWasting too much [item=rabbasca-warp-anomaly] might cause a fuel shortage, leaving the stabilizer unable to warp to any new location
rabbasca-warp-anomaly=Mining these will contribute to warpfield stabilization.\nWhen [entity=rabbasca-warp-stabilizer] changes location, each anomaly has a small chance to manifest into temporary resources native to the new location (see [tip=rabbasca-manifest-anomaly]).\nAnomalies never spawn on [tile=rabbasca-underground-rubble-powered].
rabbasca-relicary=Hidden stashes of the past, holding schematics that help unlock powerful technologies. Get a lot more schematics out of it in exchange for valuable [item=rabbasca-powerspike]. Must be located via [recipe=rabbasca-hunt-relicaries]
rabbasca-relicary-remote=Connects to the closest [entity=rabbasca-relicary]. Can be used to collect relics without leaving the safety of [tile=rabbasca-underground-rubble-powered].
rabbasca-stability-pylon=Maintains [tile=rabbasca-underground-rubble-powered] on the floor, expanding the area that can be warped to other locations. Requires [item=rabbasca-warp-cell] to function.\nWill lose health when not crafting until only 1 health is left. While below 10 health, maintenance fails and the floor becomes [tile=rabbasca-underground-rubble]. \n\n[color=red][img=virtual-signal.signal-alert]Every structure not fully covered by [tile=rabbasca-underground-rubble-powered] will be destroyed on warp! This includes [entity=rabbasca-warp-stabilizer] and [entity=rabbasca-stability-pylon] itself![/color]
rabbasca-fuel-remote-big=[entity=rabbasca-collector-pylon] will store extracted [item=rabbasca-warp-anomaly] inside this container.
rabbasca-fuel-remote=WIP. Point it at a chest or machine nearby to access their inventories.
rabbasca-collector-pylon=Repairs [entity=rabbasca-warp-anomaly], automatically warping between them and storing the extracted [item=rabbasca-warp-anomaly] in [entity=rabbasca-fuel-remote-big].\nPlace [item=rabbasca-collector-pylon] in [entity=rabbasca-fuel-remote-big] to deploy them.

