[technology-description]
rabbasca-warp-stabilizer=Reactivate [entity=rabbasca-stabilizer-consumer], allowing [entity=rabbasca-warp-stabilizer] to warp to different locations by [recipe=rabbasca-stabilize-warpfield].\n[img=virtual-signal.signal-alert] This technology is bound to the current stabilizer and will reset if the current stabilizer is abandoned!
rabbasca-warp-prep=Depending on where [entity=rabbasca-warp-stabilizer] currently is, you have access to different gases in the atmosphere, nearby liquid, and specific recipes available in [entity=rabbasca-warp-pylon]. Check the top-left bar to see what is currently available.
rabbasca-total-recall=Unlock a setting in [entity=rabbasca-warp-stabilizer]'s control panel that saves any your structures that would be left behind when changing location. They will be recalled into [virtual-signal=rabbasca-warp-inventory] instead, as long as there is room available.
rabbasca-amplify-anomaly=Make anomalies manifest on [tile=rabbasca-underground-rubble-powered], enabling mining sites that can follow [entity=rabbasca-warp-stabilizers] to new locations.
rabbasca-warp-floor-expansion=Unlock a setting in [entity=rabbasca-warp-stabilizer]'s control panel that allows expanding the safe zone around the stabilizer.\n[img=virtual-signal.signal-alert] This technology is bound to the current stabilizer and will reset if the current stabilizer is abandoned!
rabbasca-permanent-floor-expansion=Unlock a setting in [entity=rabbasca-warp-stabilizer]'s control panel that allows expanding the safe zone around the stabilizer. Unlike [technology=rabbasca-warp-floor-expansion] this upgrade persists between different stabilizers.
rabbasca-anomaly-studies=Manifest resources on [tile=rabbasca-underground-rubble-powered], so re-expanding after each warp becomes optional.
rabbasca-anomaly-expansion=Future [entity=rabbasca-warp-anomaly] will yield more resources.\n[img=virtual-signal.signal-alert] This technology is bound to the current stabilizer and will reset if the current stabilizer is abandoned!

