[tips-and-tricks-item-description]
rabbasca-underground-briefing=Rabbascan archives contain information about [space-location=rabbasca-underground] which help in making warp-tech possible. [entity=rabbasca-warp-stabilizer] frequently change places to purge [entity=rabbasca-warp-anomaly]. While you cannot visit these places yourself and supply via space platforms is unavailable, after locating one with [recipe=rabbasca-locate-stabilizer], remote management via [entity=rabbasca-warp-pylon] is possible.\n\nFocus building your factory on [tile=rabbasca-underground-rubble-powered], as everything outside will be left behind when stabilizers change location. It is also suitable flooring for machines with [item=harene-ears-core] which can bridge the gap until resources for power generation are available. Without further research, resources will only be available outside of the safe zone, requiring active mining outpost management.\n\nThe stabilizers have degraded and need active maintenance to not get stranded. Get closer to their former potential by unlocking [item=rabbasca-powerspike].\nGiving up on a stabilizer via [recipe=rabbasca-abandon-stabilizer] allows locating a new one, starting fresh. Just make sure to warp your factory to safety before doing so.
rabbasca-manifest-anomaly=[entity=rabbasca-warp-stabilizer] warps between locations to repair [entity=rabbasca-warp-anomaly]. A new set of anomalies will be found at each location. The stabilizer estimates its progress and usually leaves a location before all anomalies have been repaired. \n\nOn location change, anomalies can manifest into resources or other materials by two means:\n- Each remaining [entity=rabbasca-warp-anomaly] has a chance to manifest itself\n- Each [entity=rabbasca-warp-pylon] crafting [recipe=rabbasca-amplify-anomaly] has a chance to manifest a new anomaly below itself\n\nThe chance scales with the [color=purple]amount[/color] of [item=rabbasca-warp-anomaly] present inside [entity=rabbasca-warp-anomaly]/[entity=rabbasca-warp-pylon]([color=yellow]entity[/color]) during the location change.\nThe type of created [color=#00ffff]material[/color] depends on which planet the new location is on and each material has a different [color=orange]base chance[/color].\n[item=rabbasca-warp-anomaly] inside [entity=rabbasca-warp-pylon] also scales higher than in [entity=rabbasca-warp-anomaly] by a factor of 3.\nOr as formula:\nfor [entity=rabbasca-warp-anomaly]: \n  Chance per [color=yellow]entity[/color] to manifest into [color=#00ffff]material[/color] = [color=orange]base chance[/color] of [color=#00ffff]material[/color] * [color=purple]amount[/color] in [color=yellow]entity[/color]\nfor [entity=rabbasca-warp-pylon] crafting [recipe=rabbasca-amplify-anomaly]: \n  Chance per [color=yellow]entity[/color] to manifest into [color=#00ffff]material[/color] = [color=orange]base chance[/color] of [color=#00ffff]material[/color] * [color=purple]amount[/color] in [color=yellow]entity[/color] * 3

