[tips-and-tricks-item-description]
rabbasca-underground-briefing=Rabbascan archives contain information about [space-location=rabbasca-underground] which help in making warp-tech possible. [entity=rabbasca-warp-stabilizer] frequently change places to purge [entity=rabbasca-warp-anomaly]. While you cannot visit these places yourself and supply via space platforms is unavailable, after locating one with [recipe=rabbasca-locate-stabilizer], remote management via [entity=rabbasca-warp-pylon] is possible.\n\nFocus building your factory on [tile=rabbasca-underground-rubble-powered], as everything outside will be left behind when stabilizers change location (exception: partially exposed [entity=offshore-pump]).\nIt is also suitable flooring for machines with [item=harene-ears-core], which can bridge the gap until resources for power generation are available. Without further research, minable resources will only be available outside of the safe zone, requiring active mining outpost management.\nLocations differ in atmosphere which provides an infinite amount of gases and liquids. These are indicated by a special technology depending on the current planet, for example [technology=rabbasca-stabilizer-on-aquilo].\n\nThe stabilizers have degraded and need active maintenance to not get stranded. Get closer to their former potential by unlocking [item=rabbasca-powerspike], eventually allowing for a fully automated underground factory to produce [item=rabbasca-warpfield-science-pack].\nIf you get stranded however, giving up on a stabilizer via [recipe=rabbasca-abandon-stabilizer] allows locating a new one, starting fresh. Just make sure to warp your factory to safety before doing so.
rabbasca-underground-automation=[entity=rabbasca-warp-stabilizer] exports data about its environment and stabilization progress to a logistics group accessible via [entity=constant-combinator], logistic chests, etc.\nBy default, the group is named "[item=rabbasca-warp-trace] Warpfield stabilizer readings". This allows for detailed automation depending on current underground state or whether the floor is fully stable and warp is safe.\n\nList of signals exported:\n- [any planet signal] = The currently visited planet. The number shows stabilization progress in percent.\n- [entity=rabbasca-warp-anomaly] = How many anomalies are left to be mined (if this is 0, stabilization is at 100%)\n- [entity=rabbasca-stability-pylon] = How many of these are currently NOT providing [tile=rabbasca-underground-rubble-powered]\n- [item=rabbasca-warp-trace] = How full is the stabilizer's fuel buffer (in percent)\n- [item=rabbasca-powerspike] = How many of these has this stabilizer generated\n- [item=rabbasca-progress-powerspike] = How much progress left before the next [item=rabbasca-powerspike] is generated\n- [recipe=rabbasca-hunt-relicaries] = The percent chance of locating [entity=rabbasca-relicary] on next warp. This value only decreases when locating was successful\n- [recipe=rabbasca-hunt-anomalies] = The average resource yield of [entity=rabbasca-warp-anomaly] on next warp in percent. Resets to 100% after warp.
rabbasca-manifest-anomaly=[entity=rabbasca-warp-stabilizer] warps between locations to repair [entity=rabbasca-warp-anomaly]. A new set of anomalies will be found at each location.\n\nOn location change, anomalies have a chance to manifest into resources native to the new location. The chance scales with the amount of resources left in the anomaly and the stability of the current location.\n\nSince stabilization grows by reducing the amount of [item=rabbasca-warp-anomaly], finding a good balance is essential for efficiently locating new resources.\n\n[recipe=rabbasca-amplify-anomaly] can also be used to manifest resources. Each craft increases the amount of virtual [item=rabbasca-warp-anomaly] at the crafter's position by 1. Manifestation chance scales the same as with [item=rabbasca-warp-anomaly], but since these do not affect stabilization progress, their chance is always maximized at 100% stabilization.\n\n[color=yellow]Example[/color]: [entity=rabbasca-warp-stabilizer] is warping to [planet=fulgora], where [entity=rabbasca-holmium-ore] can manifest at a base chance of [color=green]6%[/color]. Stabilization is at [color=yellow]75%[/color].\n 1) An anomaly has [color=cyan]69[/color] [item=rabbasca-warp-anomaly] left to be mined.\n    After the warp finished, the chance for the anomaly to become a patch of [entity=rabbasca-holmium-ore] is [color=green]0.06[/color] * [color=cyan]69[/color] * [color=yellow]0.75[/color] = 310.5% (guaranteed). The amount of resources in this patch is multiplied by [color=cyan]69[/color] * [color=yellow]0.75[/color].\n 2) [entity=rabbasca-warp-pylon] has crafted [color=cyan]14[/color] [recipe=rabbasca-amplify-anomaly] in this location.\n    After the warp finished, the chance at its position to manifest a patch of [entity=rabbasca-holmium-ore] is [color=green]0.06[/color] * [color=cyan]14[/color] * [color=yellow]0.75[/color] = 63%. The amount of resources in this patch is multiplied by [color=cyan]14[/color] * [color=yellow]0.75[/color].
rabbasca-upgrade-placements=[entity=rabbasca-collector-pylon] and [entity=rabbasca-stability-pylon] are placed like normal structures. They can not be deconstructed once placed, but can be moved after placement.\n[entity=rabbasca-collector-pylon] automatically moves to [entity=rabbasca-warp-anomaly] when it has nothing left to mine.\n[entity=rabbasca-stability-pylon] will relocate to [entity=entity-ghost] of itself after crafting [recipe=rabbasca-relocate-floorthing].\n\nBoth structures can be sent to [virtual-signal=rabbasca-warp-inventory], but when [entity=rabbasca-warp-stabilizer] dies, they will be removed so they can not be used for the next stabilizer.

