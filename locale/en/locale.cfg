[item-description]
rabbasca-warp-cell=Continuously generates power for its tethered consumer. Generates less power the more spoiled it is. Once fully spoiled the tether will break and turn this cell back into [item=rabbasca-warp-cell-recharging].\n\nCan be re-tethered at the cost of half its freshness. Can be recharged (increase freshness) by keeping it inside [entity=rabbasca-warp-stabilizer]. This will drain fuel from the stabilizer.
rabbasca-warp-cell-recharging=Can be tethered to a consumer to become [item=rabbasca-warp-cell]. This will consume some fuel from [entity=rabbasca-warp-stabilizer] and restore 5% charge (freshness). Store it in [entity=rabbasca-warp-stabilizer] to keep the charge up.
rabbasca-warp-trace=A fleeting hint of the existence of a local warpfield. Up to one stack will be held in stasis in [entity=rabbasca-warp-stabilizer]. The stabilizer will automatically use these to recharge [item=rabbasca-warp-cell] stored inside.
rabbasca-summon-ufo=Call your [entity=rabbasca-ufo] fleet for assistance. All [entity=rabbasca-ufo] will try to warp nearby. Warping requires an empty inventory and consumes 50% fuel.
rabbasca-powerspike=A device that can be turned into upgrades for [entity=rabbasca-warp-stabilizer]. Generated when crafting [recipe=rabbasca-warp-trace]. Each new powerspike takes longer to generate than the last.
rabbasca-relocate-floorthing=[entity=rabbasca-stability-pylon] can not be deconstructed, but when this is crafted or a new one is created, it will try to relocate itself to a [virtual-signal=signal-ghost][entity=rabbasca-stability-pylon].
rabbasca-warpfield-engine=A device that can be targeted by [entity=rabbasca-fuel-remote] to be powered by [item=rabbasca-warp-cell]. Not as efficient as the original variants used in rabbascan devices, but still gets the job done.
rabbasca-obscure-theories=A chaotic mess of information. Equations are scribbled all over the place. One equation comes up over and over again: "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!", "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!", "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!!!"...\nYou stare in disbelief, not sure whether any of this makes sense or you are slowly going insane...
rabbasca-restored-knowledge=For brief moments, everything starts making sense. But then all of it is gone. You feel like you really should not dive deeper into these topics...
rabbasca-madness-module=An incredibly strong module powered by [item=rabbasca-powerspike]. The quality bonus provided is very unstable.
rabbasca-warpfield-science-pack=Resonates with the local warp field. Can be uploaded to [virtual-signal=rabbasca-warp-inventory] through [entity=rabbasca-warp-uplink] and retrieved anywhere with [recipe=rabbasca-warpfield-science-pack-wi-download].
rabbasca-warpfield-science-pack-wi-download=Downloads up to a full stack of [item=rabbasca-warpfield-science-pack] from [virtual-signal=rabbasca-warp-inventory].

