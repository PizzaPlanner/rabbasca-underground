panel-progress-tooltip=Stability indicates how many [item=rabbasca-warp-anomaly] were mined in this location. 100% means all of the initial __1__ [item=rabbasca-warp-anomaly] were mined. The current stability progress and how many [item=rabbasca-warp-anomaly] are left to mine are exported to a logistic group, accessible through i.e. [entity=constant-combinator].
panel-setting-radius=Set the radius of [tile=rabbasca-underground-rubble-powered] around the stabilizer. Increases [item=rabbasca-warp-cell] upkeep by __1__ per minute for every step of 4 beyond the minimum.\nThis setting only takes effect after warping to a new location.
