panel-progress-tooltip=Stability indicates how many [item=rabbasca-warp-matrix] were mined in this location. 100% means all of the initial __1__ [item=rabbasca-warp-matrix] were mined. The current stability progress and how many [item=rabbasca-warp-matrix] are left to mine are exported to a logistic group, accessible through i.e. [entity=constant-combinator].
