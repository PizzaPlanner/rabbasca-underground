[recipe-description]
rabbasca-locate-stabilizer=Instruct the vault to locate a [space-location=rabbasca-underground] and place [entity=rabbasca-warp-pylon] nearby. This may take multiple attempts, but failed attempts refund the pylon.\nCrafting this with a stabilizer located will create an additional [entity=rabbasca-warp-pylon] next to it. This recipe deselects itself on success.
rabbasca-stabilizer-consumer=Restarts [entity=rabbasca-stabilizer-consumer], which will constantly harvest [item=rabbasca-warp-matrix] to fuel [entity=rabbasca-warp-stabilizer]. It will run continuously, even when the stabilizer is paused. 
rabbasca-amplify-anomaly=Destabilizes the position of the crafter, increasing its likelyhood to manifest an anomaly on location change. (see [tip=rabbasca-manifest-anomaly]). This can cause resources to spawn on top of [tile=rabbasca-underground-rubble-powered] to establish permanent mining sites.\n\nAlso increases the amount of [item=rabbasca-stabilize-warpfield] work required in this location before warping to the next by one.
rabbasca-abandon-stabilizer=Give up on this stabilizer. This might be your last option if the stabilizer ran out of fuel. [entity=rabbasca-vault-crafter] can discover a new stabilizer afterwards.\n[color=red][img=virtual-signal.signal-alert] Everything around the stabilizer will be destroyed, including your factory![/color]\n[color=#33aaff][img=virtual-signal.signal-info]This recipe does not consume fuel when crafted by [entity=rabbasca-warp-stabilizer].[/color]
rabbasca-reboot-stabilizer=Reboot the stabilizer. This will restore some emergency fuel and temporarily grant an efficiency bonus at the cost of slower speed.\n[color=#33aaff][img=virtual-signal.signal-info]This recipe does not consume fuel when crafted by [entity=rabbasca-warp-stabilizer].[/color]
rabbasca-warp-cell=[color=#33aaff][img=virtual-signal.signal-info]This recipe does not consume fuel when crafted by [entity=rabbasca-warp-stabilizer].[/color]\n[color=#33aaff][img=virtual-signal.signal-info]When 'Synthesize fuel' is enabled in [entity=rabbasca-warp-stabilizer]'s control panel, it will automatically switch to this recipe when out of fuel.[/color]
rabbasca-stabilizer-warp-sequence=Warps to the next location, leaving behind anything not placed on [tile=rabbasca-underground-rubble-powered]. Remaining anomalies have a chance to manifest into resources. All stored [item=rabbasca-warp-trace] will be left behind.\n[color=yellow][img=virtual-signal.signal-alert]This recipe's fuel cost depend on current stabilization progress. Check the current cost in [entity=rabbasca-warp-stabilizer]'s dashboard to not get stranded while trying to leave![/color]\n[color=#33aaff][img=virtual-signal.signal-info]When 'Autopilot' is enabled in [entity=rabbasca-warp-stabilizer]'s control panel, it will automatically switch to this recipe once stabilization reaches 100%[/color]
rabbasca-stabilizer-toggle-extractor=Enables or disables [entity=rabbasca-stabilizer-consumer]. While active, [entity=rabbasca-warp-stabilizer] will consume more fuel while crafting, but will receive a steady supply of [item=rabbasca-warp-matrix]

