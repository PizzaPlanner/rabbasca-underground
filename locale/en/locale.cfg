[item-description]
rabbasca-warp-cell=Continuously generates power for its tethered consumer. Power generation scales with freshness. Once fully spoiled the tether will break and turn this cell back into [item=rabbasca-warp-cell-recharging].\n\nCan be re-tethered at any time at the cost of half its freshness. Freshness is restored by draining [entity=rabbasca-warp-stabilizer]'s fuel buffer.
rabbasca-warp-cell-recharging=Can be tethered to a consumer to become [item=rabbasca-warp-cell]. This will consume some fuel from [entity=rabbasca-warp-stabilizer] and restore 5% charge (freshness). Store it in [entity=rabbasca-warp-stabilizer] to keep the charge up.
rabbasca-warp-trace=A fleeting hint of the existence of a local warpfield. Up to one stack will be held in stasis in [entity=rabbasca-warp-stabilizer]. The stabilizer will automatically use these to recharge [item=rabbasca-warp-cell] stored inside.
rabbasca-powerspike=A device that can be turned into upgrades for [entity=rabbasca-warp-stabilizer]. Generated when crafting [recipe=rabbasca-warp-trace]. Each new powerspike takes longer to generate than the last.
rabbasca-powerspike-weak=Unusable in this state.
rabbasca-obscure-theories=A chaotic mess of information. Equations are scribbled all over the place. One equation comes up over and over again: "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!", "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!", "[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!!!"...\nYou stare in disbelief, not sure whether any of this makes sense or you are slowly going insane...
rabbasca-restored-knowledge=For brief moments, everything starts making sense. But then all of it is gone. You feel like you really should not dive deeper into these topics...
rabbasca-sanity-loss="This is valuable insight, what might go wrong?"
rabbasca-sanity-mote=Spoiling in [entity=character]'s inventory will undo some [item=rabbasca-sanity-loss], unless [item=rabbasca-tinfoil-hat] is worn.\n\nObtained by fighting the insanity.

