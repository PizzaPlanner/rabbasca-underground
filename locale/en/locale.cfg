[recipe-description]
rabbasca-locate-stabilizer=Instruct the vault to locate a [space-location=rabbasca-underground] and place [entity=rabbasca-warp-pylon] nearby. This may take multiple attempts, but failed attempts refund the pylon.\nCrafting this with a stabilizer located will create an additional [entity=rabbasca-warp-pylon] next to it. This recipe deselects itself on success.
rabbasca-anomaly-extractor=Restarts [entity=rabbasca-anomaly-extractor], which will constantly harvest [item=rabbasca-warp-anomaly] to fuel [entity=rabbasca-warp-stabilizer]. It will run continuously, even when the stabilizer is paused. 
rabbasca-amplify-anomaly=Destabilizes the position of the crafter, increasing its likelyhood to manifest an anomaly on location change. (see [tip=rabbasca-manifest-anomaly]). This can cause resources to spawn on top of [tile=rabbasca-underground-rubble-powered] to establish permanent mining sites.
rabbasca-abandon-stabilizer=Give up on this stabilizer. This might be your last option if the stabilizer ran out of fuel. [entity=rabbasca-vault-crafter] can discover a new stabilizer afterwards.\n[color=red][img=virtual-signal.signal-alert] Everything around the stabilizer will be destroyed, including your factory![/color]\n[color=#33aaff][img=virtual-signal.signal-info]This recipe does not consume fuel when crafted by [entity=rabbasca-warp-stabilizer].[/color]
rabbasca-reboot-stabilizer=Reboot the stabilizer. This will restore some emergency fuel and temporarily grant an efficiency bonus at the cost of slower speed.\n[color=#33aaff][img=virtual-signal.signal-info]This recipe does not consume fuel when crafted by [entity=rabbasca-warp-stabilizer].[/color]
rabbasca-warp-cell=[color=#33aaff][img=virtual-signal.signal-info]This recipe does not consume fuel when crafted by [entity=rabbasca-warp-stabilizer].[/color]\n[color=#33aaff][img=virtual-signal.signal-info]When 'Synthesize fuel' is enabled in [entity=rabbasca-warp-stabilizer]'s control panel, it will automatically switch to this recipe when out of fuel.[/color]
rabbasca-stabilizer-warp-sequence=Warps to the next location, [color=yellow]leaving behind anything not placed on [tile=rabbasca-underground-rubble-powered][/color]. Remaining anomalies have a chance to manifest into resources. [item=rabbasca-warp-trace] stasis will be suspended during warp.\n[color=#33aaff][img=virtual-signal.signal-info]This recipe will not craft when current stability is below 20% or [entity=rabbasca-warp-stabilizer] is not fully covered by [tile=rabbasca-underground-rubble-powered][/color]\n[color=#33aaff][img=virtual-signal.signal-info]When 'Autopilot' is enabled in [entity=rabbasca-warp-stabilizer]'s control panel, it will automatically switch to this recipe once stabilization reaches 100%[/color]
rabbasca-stabilizer-toggle-extractor=Enables or disables [entity=rabbasca-anomaly-extractor]. While enabled, it mines [entity=rabbasca-warp-anomaly] directly into [entity=rabbasca-warp-stabilizer] with unlimited range.\n\n[img=virtual-signal.signal-info]While enabled, [item=rabbasca-warp-cell] upkeep is increased by [/color]__1__[color=#33aaff]/min[/color]
rabbasca-stabilizer-toggle-relichunter=Enables or disables the quantum-calibrator. While enabled, each warp increases the chance of finding rare relic caches. The chance scales with stabilization progress at the time of warp.\nDisabling it resets the chance to 0.\n\n[color=#33aaff][img=virtual-signal.signal-info]While enabled, [item=rabbasca-warp-cell] upkeep is increased by [/color]__1__[color=#33aaff]/min and the cost of [recipe=rabbasca-stabilizer-warp-sequence] is increased significantly.[/color]
rabbasca-floor-stability-work=Prevents health loss
rabbasca-emergency-fuel=Gives a bunch of [item=rabbasca-warp-trace] in emergency situations.\n[color=#33aaff][img=virtual-signal.signal-info]To prevent accidental loss of valuable [item=rabbasca-powerspike], this recipe can only be crafted when the stabilizer ran completely out of fuel.[/color]
rabbasca-stabilizer-recharge=While this recipe is crafting, all [item=rabbasca-warp-cell-recharging] and [item=rabbasca-warp-cell] are warped into the stabilizer's inventory.
rabbasca-underground=Locate [entity=rabbasca-warp-stabilizer] and uncover the secrets of rabbascan warp technology.

