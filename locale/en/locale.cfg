[entity-description]
rabbasca-warp-stabilizer=A true marvel of rabbascan engineering that actively seeks and purges [entity=rabbasca-warp-anomaly], using them as fuel for itself.\nWhen it has decided that enough work on its current location was done, it will warp itself and your structures on [tile=rabbasca-underground-rubble-powered] to a new location.\n\nThe stabilization process can be paused, but anomaly purging can not, creating risk of getting stranded on prolonged stays in the same location.
rabbasca-stabilizer-consumer=The engine required to power [entity=rabbasca-warp-stabilizer]. Fuels itself by constantly purging [entity=rabbasca-warp-anomaly].\n\n[img=virtual-signal.signal-alert] Can not be stopped once started by [technology=rabbasca-warp-stabilizer].\nWasting too much [item=rabbasca-warp-matrix] might cause a fuel shortage, leaving the stabilizer unable to warp to any new location
rabbasca-warp-anomaly=Mining these will contribute to warp-field stabilization.\nWhen [entity=rabbasca-warp-stabilizer] changes location, each anomaly has a small chance to manifest into temporary resources native to the new location (see [tip=rabbasca-manifest-anomaly]).\nAnomalies never spawn on [tile=rabbasca-underground-rubble-powered].

